name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código
      - name: Checkout repo
        uses: actions/checkout@v3

      # Paso 2: Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Paso 3: Instalar dependencias necesarias
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk python3-pip python3-setuptools \
            python3-wheel python3-cffi build-essential libssl-dev libffi-dev \
            libxml2-dev libxslt1-dev zlib1g-dev libjpeg-dev libfreetype6-dev \
            liblcms2-dev libblas-dev liblapack-dev libatlas-base-dev \
            gfortran libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libtiff5-dev libgtk-3-dev
          pip install --upgrade pip
          pip install buildozer

      # Paso 4: Construir APK usando Buildozer
      - name: Build APK
        run: |
          buildozer android debug

      # Paso 5: Verificar que el APK se ha generado correctamente (listar archivos)
      - name: List files in bin directory
        run: ls -la bin/

      # Paso 6: Subir el APK como artifact usando una versión diferente de upload-artifact
      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: flet-apk
          path: bin/*.apk
